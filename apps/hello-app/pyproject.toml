[project]
name = "hello-app"
version = "0.1.0"
description = "A runnable app in the uv workspace sample"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "greetings"]

[project.scripts]
hello-app = "hello_app.cli:main"

[tool.uv.sources]
greetings = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
