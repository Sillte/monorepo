[project]
name = "greetings"
version = "0.1.0"
description = "A small reusable greeting library for the uv workspace sample"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
greetings = "greetings.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
